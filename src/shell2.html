<title>Котоба Сампо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна узкая колонка, как лист в тетради; нижняя навигация на телефоне, верхняя на десктопе */
:root{
  --paper:#eef1ef; --sheet:#f8faf9; --ink:#1d2a36; --muted:#5d6b75; --line:#d3dbd8;
  --ai:#2f4f86; --ai-soft:#dce4f2; --moss:#4f6b4a; --moss-soft:#dfe8da; --rust:#9a4a3a; --rust-soft:#f1e0da;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a20; --sheet:#1b232b; --ink:#e3e8ec; --muted:#97a4ad; --line:#2d3842;
  --ai:#9db4e0; --ai-soft:#24324a; --moss:#a6c49d; --moss-soft:#25331f; --rust:#e3a091; --rust-soft:#3a2520; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a20; --sheet:#1b232b; --ink:#e3e8ec; --muted:#97a4ad; --line:#2d3842;
  --ai:#9db4e0; --ai-soft:#24324a; --moss:#a6c49d; --moss-soft:#25331f; --rust:#e3a091; --rust-soft:#3a2520; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font:700 18px var(--f-jp);letter-spacing:.02em}
.brand small{font:400 13px var(--f-body);color:var(--muted);margin-left:8px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font:500 14px var(--f-body);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);background:var(--sheet)}
@media (max-width:560px){
  nav{position:fixed;left:0;right:0;bottom:0;justify-content:space-around;background:var(--sheet);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
}
h1{font:600 26px/1.25 var(--f-body);margin:0 0 6px;text-wrap:balance}
h2{font:600 16px var(--f-body);margin:0 0 8px}
p{margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:16px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.today{padding-block:12px 24px}
.note{background:var(--ai-soft);padding:12px 14px;border-radius:10px;margin-top:18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.panel.quiet{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.primary{background:var(--ai);color:var(--sheet);border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--ai);border:1px solid var(--line);border-radius:10px;padding:11px 18px;cursor:pointer}
.link{background:none;border:0;color:var(--ai);padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* карточка */
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:14px;min-height:300px}
.kana{font-family:var(--f-jp);line-height:1.1}
.kana.big{font-size:min(34vw,140px);margin:4px 0 8px}
.kana.word{font-size:min(14vw,64px);margin:24px 0 12px}
.kana.mid{font-size:30px;margin-right:6px}
.ru{font-size:28px;font-weight:600;margin:36px 0 12px}
.ask{color:var(--muted)}
.hint{color:var(--moss);font-size:14px}
.field{display:block;max-width:320px;margin:10px auto 0;text-align:left}
.field input{width:100%;font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center}
.preview{display:block;min-height:1.6em;font:22px var(--f-jp);color:var(--muted);text-align:center;margin-top:4px}
.sol{font-size:22px;margin-top:10px}
.mnem{max-width:46ch;margin:10px auto;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
.ok{color:var(--moss);font-weight:600;margin-top:14px}
.miss{color:var(--rust);margin-top:14px;max-width:46ch;margin-inline:auto}
#controls{justify-content:center}
.grade{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.grade small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grade.sugg{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.g1 span{color:var(--rust)}
.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
@media (hover:none){.keys{display:none}}
.pause{padding-block:40px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.sum div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px}
.sum dt{font-size:13px;color:var(--muted)} .sum dd{margin:0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.sum dd small{font-size:15px;color:var(--muted);font-weight:400}
/* библиотека */
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grp h2{margin:0}
.switch{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:20px/1 var(--f-jp);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.chip.sm{font-size:13px;padding:2px 5px}
.chip.l{background:var(--ai-soft);border-color:transparent}
.chip.m{background:var(--moss-soft);border-color:transparent;color:var(--moss)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form label.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.form input:not([type=checkbox]),.form select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.form .preview{text-align:left;font-size:18px}
textarea{margin-top:10px;font:12px/1.4 ui-monospace,monospace}
/* прогресс */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:150px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:70%;background:var(--ai);border-radius:4px 4px 0 0;min-height:2px}
.bar .v{font-size:12px;font-variant-numeric:tabular-nums}
.bar .d{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.track{height:8px;background:var(--paper);border-radius:4px;display:flex;overflow:hidden}
.track i{display:block;height:100%} .track .m{background:var(--moss)} .track .l{background:var(--ai);opacity:.55}
.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

/* уроки */
nav button{padding:8px 10px}
@media (max-width:560px){nav button{font-size:12.5px;padding:8px 4px}}
.lesson-next{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;margin:22px 0 14px}
.lt{font:600 22px/1.3 var(--f-body);margin-bottom:6px}
.kana-row{font:30px/1.3 var(--f-jp);letter-spacing:.12em;margin:6px 0 10px;word-break:break-all}
.kana-row.sm{font-size:20px;margin:2px 0 0}
.tasks{margin:0;padding-left:20px;display:grid;gap:6px}
.llist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.llist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.llist li>div:first-child{min-width:0}
.llist h2{margin:0}
.llist li.done{background:transparent}
.llist li.next{border-color:var(--ai)}
.theory{max-width:62ch}
.theory ul{padding-left:20px;display:grid;gap:6px;margin:0 0 12px}
article.theory{margin-bottom:18px}
article.theory p,article.theory li{font-size:17px}
.lhead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:6px}
.lbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.lbar i{display:block;height:100%;background:var(--ai);transition:width .3s}
.meet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.meet-info{grid-column:1/-1;order:3}
@media (max-width:560px){.meet{padding:12px;gap:10px}}
@media (max-width:340px){.meet{grid-template-columns:1fr}}
.meet-glyph,.meet-pad{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px;min-width:0}
svg.strokes{width:100%;max-width:220px;aspect-ratio:1;background:var(--paper);border-radius:12px}
svg.strokes.small{max-width:150px}
svg.strokes path,.padguide path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.strokes .guide path{stroke:var(--line);stroke-width:4}
svg.strokes .anim path{stroke:var(--ink);stroke-width:4.5}
.pad{position:relative;width:100%;max-width:220px;aspect-ratio:1;background:var(--paper);border-radius:12px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.card .pad{margin:12px auto 0}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padguide{position:absolute;inset:0;width:100%;height:100%}
.padguide path{stroke:var(--line);stroke-width:7;opacity:.9}
.row.center{justify-content:center}
.reading{font-size:22px;margin-bottom:6px}
.meet-info .mnem{margin:8px 0;max-width:none}
.breakdown{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.breakdown span{display:grid;justify-items:center;background:var(--paper);border-radius:8px;padding:6px 8px;min-width:40px}
.breakdown b{font:24px var(--f-jp)} .breakdown small{color:var(--muted);font:12px var(--f-body)}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px;margin:16px auto 0}
.opt{padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer}
.kana-opts .opt{font:30px/1.2 var(--f-jp)}
.opt.right{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.opt.wrong{background:var(--rust-soft);border-color:var(--rust);color:var(--rust)}
.opt:disabled{cursor:default}
.pairs{display:grid;gap:10px;margin-bottom:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px}
.pair>div{display:grid;gap:2px;justify-items:start;min-width:0}
.pair small{color:var(--muted);font-size:13px}
.cmp{display:flex;justify-content:center;margin-top:10px}
/* справочник */
.kgrid{display:grid;gap:6px;overflow-x:auto}
.grow{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:6px}
.cell{display:grid;justify-items:center;gap:0;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.cell span{font:24px/1.2 var(--f-jp)} .cell small{font-size:11px;color:var(--muted)}
.cell.empty{border:0;background:none;cursor:default}
.cell.l{background:var(--ai-soft);border-color:transparent}
.cell.m{background:var(--moss-soft);border-color:transparent}
.cell-l{font-size:12px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.cell-l.l{background:var(--ai-soft)} .cell-l.m{background:var(--moss-soft)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.detail svg.strokes{width:150px}
@media (max-width:460px){.detail{grid-template-columns:1fr}}
.wlist{display:grid;gap:4px}
.wlist div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wlist span[lang]{font:18px var(--f-jp)} .wlist small{color:var(--muted)}
.credit{margin-top:16px}
.credit a{color:var(--muted)}

/* фразы */
.fun-jp{font:28px/1.3 var(--f-jp);margin:4px 0 8px}
.phrase .ph-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phrase .kana.word{margin:4px 0;font-size:min(10vw,44px);text-align:left}
.ph-ru{font-size:19px;margin:8px 0 4px}
.ph-say{font-size:16px}
.kanarow{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.kc{display:grid;justify-items:center;min-width:34px;padding:4px 5px;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
.kc b{font:22px/1.2 var(--f-jp);font-weight:400} .kc small{font-size:11px;color:var(--muted)}
.kc.known{background:var(--moss-soft);border-color:transparent}
.kc.sep{background:none;border-color:transparent}
.phrase h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.wbd{display:grid;gap:8px}
.wb{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wb .play{font-size:16px;text-decoration:none;padding:2px 4px}
.wjp{font:26px/1.2 var(--f-jp);min-width:2.2em}
.lylines{display:grid}
.ksrc input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.filebtn{display:inline-block;cursor:pointer}
.kplayer iframe,.kplayer video{width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:10px;display:block}
.kplayer audio{width:100%;margin-top:10px}
.kctl{position:sticky;top:0;z-index:5}
.tapbig{width:100%;padding:20px;font-size:18px;margin:6px 0}
.knext{font:20px/1.5 var(--f-jp);margin:0 0 6px}
.klines{display:grid;gap:4px;margin:8px 0 24px}
.kl{padding:10px 12px;border-radius:10px;opacity:.5;transition:opacity .25s,background .25s;cursor:pointer}
.kl.next{opacity:.8}.kl.past{opacity:.4}
.kl.now{opacity:1;background:var(--ai-soft)}
.kjp{font:20px/2 var(--f-jp);margin:0}.kl.now .kjp{font-size:24px}
.kjp ruby rt{font-size:.5em;color:var(--muted)}
.kl.en .kjp{font-family:var(--f-body)}
.kro{color:var(--muted);font-size:14px;margin:0}.kru{font-size:14px;margin:2px 0 0}
.kbar{height:3px;margin-top:6px;border-radius:2px;overflow:hidden;visibility:hidden}.kl.now .kbar{visibility:visible;background:var(--line)}
.kbar i{display:block;height:100%;width:0;background:var(--ai)}
.lyl{padding:10px 0;border-top:1px solid var(--line)}
.lyjp{font:20px/1.5 var(--f-jp);margin:0}
.lyro{color:var(--muted);font-size:14px;margin:0 0 4px}
.lynote input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px}
textarea#ly-txt{font:16px/1.5 var(--f-jp);width:100%;margin:8px 0}
.lyh{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.lyjp ruby rt{font-size:.5em;color:var(--muted)}
.lyjp{line-height:2}
.rep{font:12px var(--f-body);color:var(--muted);background:var(--paper);border-radius:6px;padding:1px 6px}
.lyl.en .lyjp{font-family:var(--f-body)}
.lybd{background:var(--paper);border-radius:10px;padding:4px 10px;margin:6px 0}
.lybd .wb{border-top-color:var(--line)}
.lybd .wjp ruby rt{font-size:.45em;color:var(--muted)}
.gram{margin:4px 0;padding-left:18px;font-size:13px;color:var(--muted)}
.ownf{display:flex;gap:6px;align-items:center}
.ownf input{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0}
#ly-out{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px 16px 12px;margin-bottom:12px}
#ly-out:empty{display:none}
details summary{cursor:pointer;color:var(--ai);margin:8px 0}
.who-line:has(#who-st:empty){display:none}
.who-line #sync-st{opacity:.7}
#login{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.login-in{width:100%;max-width:360px;display:grid;gap:12px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-b{font-size:18px;padding:16px}
.who-b[aria-pressed="true"]{background:var(--ai);color:var(--sheet);border-color:var(--ai)}
.pinl{font-size:14px;color:var(--muted)}
#pin{font-size:24px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:10px 0}
.skb{display:grid;justify-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.skb span{font:30px/1.2 var(--f-jp)} .skb small{font-size:11px;color:var(--muted);text-align:center}
.skb.key{border-color:var(--rust)} .skb.key span{color:var(--rust)}
.skdet{background:var(--paper);border-radius:12px;padding:12px 14px;margin:8px 0}
.skdet .kana.word{text-align:left;margin:0}
.skchars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.skc{display:grid;justify-items:center;width:120px}
.skc svg.strokes.small{max-width:120px;background:var(--sheet)}
.ph-h{margin:20px 0 10px}
/* письмо */
.wsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wsvg path,.wsvg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wsvg .refp{opacity:0}
.wsvg .guide path{stroke:var(--line);stroke-width:7}
.wsvg .donep .ok{stroke:var(--ink);stroke-width:5}
.wsvg .donep .shown{stroke:var(--rust);stroke-width:5;opacity:.75}
.wsvg .live{stroke:var(--ai);stroke-width:5}
.wsvg .live.bad{stroke:var(--rust)}
.wsvg .hpath{stroke:var(--ai);stroke-width:6;opacity:.55}
.wsvg .hdot{fill:var(--ai)}
@media (prefers-reduced-motion:no-preference){.wsvg .hdot{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.wmsg{min-height:2.8em;margin:6px 0 0;font-size:14px;color:var(--muted);text-align:center;max-width:36ch;margin-inline:auto}
