<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4f86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Котоба Сампо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: одна узкая колонка, как лист в тетради; нижняя навигация на телефоне, верхняя на десктопе */
:root{
  --paper:#eef1ef; --sheet:#f8faf9; --ink:#1d2a36; --muted:#5d6b75; --line:#d3dbd8;
  --ai:#2f4f86; --ai-soft:#dce4f2; --moss:#4f6b4a; --moss-soft:#dfe8da; --rust:#9a4a3a; --rust-soft:#f1e0da;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a20; --sheet:#1b232b; --ink:#e3e8ec; --muted:#97a4ad; --line:#2d3842;
  --ai:#9db4e0; --ai-soft:#24324a; --moss:#a6c49d; --moss-soft:#25331f; --rust:#e3a091; --rust-soft:#3a2520; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a20; --sheet:#1b232b; --ink:#e3e8ec; --muted:#97a4ad; --line:#2d3842;
  --ai:#9db4e0; --ai-soft:#24324a; --moss:#a6c49d; --moss-soft:#25331f; --rust:#e3a091; --rust-soft:#3a2520; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{font:700 18px var(--f-jp);letter-spacing:.02em}
.brand small{font:400 13px var(--f-body);color:var(--muted);margin-left:8px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font:500 14px var(--f-body);cursor:pointer}
nav button[aria-current="page"]{color:var(--ink);background:var(--sheet)}
@media (max-width:560px){
  nav{position:fixed;left:0;right:0;bottom:0;justify-content:space-around;background:var(--sheet);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
}
h1{font:600 26px/1.25 var(--f-body);margin:0 0 6px;text-wrap:balance}
h2{font:600 16px var(--f-body);margin:0 0 8px}
p{margin:0 0 10px}
.sub{color:var(--muted);margin-bottom:16px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.today{padding-block:12px 24px}
.note{background:var(--ai-soft);padding:12px 14px;border-radius:10px;margin-top:18px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.panel.quiet{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.primary{background:var(--ai);color:var(--sheet);border:0;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--ai);border:1px solid var(--line);border-radius:10px;padding:11px 18px;cursor:pointer}
.link{background:none;border:0;color:var(--ai);padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* карточка */
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:14px;min-height:300px}
.kana{font-family:var(--f-jp);line-height:1.1}
.kana.big{font-size:min(34vw,140px);margin:4px 0 8px}
.kana.word{font-size:min(14vw,64px);margin:24px 0 12px}
.kana.mid{font-size:30px;margin-right:6px}
.ru{font-size:28px;font-weight:600;margin:36px 0 12px}
.ask{color:var(--muted)}
.hint{color:var(--moss);font-size:14px}
.field{display:block;max-width:320px;margin:10px auto 0;text-align:left}
.field input{width:100%;font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center}
.preview{display:block;min-height:1.6em;font:22px var(--f-jp);color:var(--muted);text-align:center;margin-top:4px}
.sol{font-size:22px;margin-top:10px}
.mnem{max-width:46ch;margin:10px auto;color:var(--ink);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
.ok{color:var(--moss);font-weight:600;margin-top:14px}
.miss{color:var(--rust);margin-top:14px;max-width:46ch;margin-inline:auto}
#controls{justify-content:center}
.grade{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.grade small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grade.sugg{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.g1 span{color:var(--rust)}
.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
@media (hover:none){.keys{display:none}}
.pause{padding-block:40px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.sum div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px}
.sum dt{font-size:13px;color:var(--muted)} .sum dd{margin:0;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.sum dd small{font-size:15px;color:var(--muted);font-weight:400}
/* библиотека */
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.grp h2{margin:0}
.switch{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:20px/1 var(--f-jp);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.chip.sm{font-size:13px;padding:2px 5px}
.chip.l{background:var(--ai-soft);border-color:transparent}
.chip.m{background:var(--moss-soft);border-color:transparent;color:var(--moss)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form label.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.form input:not([type=checkbox]),.form select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.form .preview{text-align:left;font-size:18px}
textarea{margin-top:10px;font:12px/1.4 ui-monospace,monospace}
/* прогресс */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:150px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:70%;background:var(--ai);border-radius:4px 4px 0 0;min-height:2px}
.bar .v{font-size:12px;font-variant-numeric:tabular-nums}
.bar .d{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.prow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.track{height:8px;background:var(--paper);border-radius:4px;display:flex;overflow:hidden}
.track i{display:block;height:100%} .track .m{background:var(--moss)} .track .l{background:var(--ai);opacity:.55}
.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

/* уроки */
nav button{padding:8px 10px}
@media (max-width:560px){nav button{font-size:12.5px;padding:8px 4px}}
.lesson-next{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;margin:22px 0 14px}
.lt{font:600 22px/1.3 var(--f-body);margin-bottom:6px}
.kana-row{font:30px/1.3 var(--f-jp);letter-spacing:.12em;margin:6px 0 10px;word-break:break-all}
.kana-row.sm{font-size:20px;margin:2px 0 0}
.tasks{margin:0;padding-left:20px;display:grid;gap:6px}
.llist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.llist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.llist li>div:first-child{min-width:0}
.llist h2{margin:0}
.llist li.done{background:transparent}
.llist li.next{border-color:var(--ai)}
.theory{max-width:62ch}
.theory ul{padding-left:20px;display:grid;gap:6px;margin:0 0 12px}
article.theory{margin-bottom:18px}
article.theory p,article.theory li{font-size:17px}
.lhead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;margin-bottom:6px}
.lbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.lbar i{display:block;height:100%;background:var(--ai);transition:width .3s}
.meet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.meet-info{grid-column:1/-1;order:3}
@media (max-width:560px){.meet{padding:12px;gap:10px}}
@media (max-width:340px){.meet{grid-template-columns:1fr}}
.meet-glyph,.meet-pad{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:6px;min-width:0}
svg.strokes{width:100%;max-width:220px;aspect-ratio:1;background:var(--paper);border-radius:12px}
svg.strokes.small{max-width:150px}
svg.strokes path,.padguide path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.strokes .guide path{stroke:var(--line);stroke-width:4}
svg.strokes .anim path{stroke:var(--ink);stroke-width:4.5}
.pad{position:relative;width:100%;max-width:220px;aspect-ratio:1;background:var(--paper);border-radius:12px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.card .pad{margin:12px auto 0}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.padguide{position:absolute;inset:0;width:100%;height:100%}
.padguide path{stroke:var(--line);stroke-width:7;opacity:.9}
.row.center{justify-content:center}
.reading{font-size:22px;margin-bottom:6px}
.meet-info .mnem{margin:8px 0;max-width:none}
.breakdown{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.breakdown span{display:grid;justify-items:center;background:var(--paper);border-radius:8px;padding:6px 8px;min-width:40px}
.breakdown b{font:24px var(--f-jp)} .breakdown small{color:var(--muted);font:12px var(--f-body)}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px;margin:16px auto 0}
.opt{padding:14px 8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer}
.kana-opts .opt{font:30px/1.2 var(--f-jp)}
.opt.right{background:var(--moss-soft);border-color:var(--moss);color:var(--moss)}
.opt.wrong{background:var(--rust-soft);border-color:var(--rust);color:var(--rust)}
.opt:disabled{cursor:default}
.pairs{display:grid;gap:10px;margin-bottom:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px}
.pair>div{display:grid;gap:2px;justify-items:start;min-width:0}
.pair small{color:var(--muted);font-size:13px}
.cmp{display:flex;justify-content:center;margin-top:10px}
/* справочник */
.kgrid{display:grid;gap:6px;overflow-x:auto}
.grow{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:6px}
.cell{display:grid;justify-items:center;gap:0;padding:6px 2px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.cell span{font:24px/1.2 var(--f-jp)} .cell small{font-size:11px;color:var(--muted)}
.cell.empty{border:0;background:none;cursor:default}
.cell.l{background:var(--ai-soft);border-color:transparent}
.cell.m{background:var(--moss-soft);border-color:transparent}
.cell-l{font-size:12px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
.cell-l.l{background:var(--ai-soft)} .cell-l.m{background:var(--moss-soft)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.detail svg.strokes{width:150px}
@media (max-width:460px){.detail{grid-template-columns:1fr}}
.wlist{display:grid;gap:4px}
.wlist div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wlist span[lang]{font:18px var(--f-jp)} .wlist small{color:var(--muted)}
.credit{margin-top:16px}
.credit a{color:var(--muted)}

/* фразы */
.fun-jp{font:28px/1.3 var(--f-jp);margin:4px 0 8px}
.phrase .ph-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.phrase .kana.word{margin:4px 0;font-size:min(10vw,44px);text-align:left}
.ph-ru{font-size:19px;margin:8px 0 4px}
.ph-say{font-size:16px}
.kanarow{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.kc{display:grid;justify-items:center;min-width:34px;padding:4px 5px;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
.kc b{font:22px/1.2 var(--f-jp);font-weight:400} .kc small{font-size:11px;color:var(--muted)}
.kc.known{background:var(--moss-soft);border-color:transparent}
.kc.sep{background:none;border-color:transparent}
.phrase h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.wbd{display:grid;gap:8px}
.wb{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wb .play{font-size:16px;text-decoration:none;padding:2px 4px}
.wjp{font:26px/1.2 var(--f-jp);min-width:2.2em}
.lylines{display:grid}
.lyl{padding:10px 0;border-top:1px solid var(--line)}
.lyjp{font:20px/1.5 var(--f-jp);margin:0}
.lyro{color:var(--muted);font-size:14px;margin:0 0 4px}
.lynote input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px}
textarea#ly-txt{font:16px/1.5 var(--f-jp);width:100%;margin:8px 0}
.lyh{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.lyjp ruby rt{font-size:.5em;color:var(--muted)}
.lyjp{line-height:2}
.rep{font:12px var(--f-body);color:var(--muted);background:var(--paper);border-radius:6px;padding:1px 6px}
.lyl.en .lyjp{font-family:var(--f-body)}
.lybd{background:var(--paper);border-radius:10px;padding:4px 10px;margin:6px 0}
.lybd .wb{border-top-color:var(--line)}
.lybd .wjp ruby rt{font-size:.45em;color:var(--muted)}
.gram{margin:4px 0;padding-left:18px;font-size:13px;color:var(--muted)}
.ownf{display:flex;gap:6px;align-items:center}
.ownf input{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);min-width:0}
#ly-out{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px 16px 12px;margin-bottom:12px}
#ly-out:empty{display:none}
details summary{cursor:pointer;color:var(--ai);margin:8px 0}
#who-st:empty,#who-st:empty+#sync-st{display:none}
.who-line #sync-st{opacity:.7}
#login{min-height:100%;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px}
.login-in{width:100%;max-width:360px;display:grid;gap:12px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-b{font-size:18px;padding:16px}
.who-b[aria-pressed="true"]{background:var(--ai);color:var(--sheet);border-color:var(--ai)}
.pinl{font-size:14px;color:var(--muted)}
#pin{font-size:24px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
/* письмо */
.wsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wsvg path,.wsvg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wsvg .refp{opacity:0}
.wsvg .guide path{stroke:var(--line);stroke-width:7}
.wsvg .donep .ok{stroke:var(--ink);stroke-width:5}
.wsvg .donep .shown{stroke:var(--rust);stroke-width:5;opacity:.75}
.wsvg .live{stroke:var(--ai);stroke-width:5}
.wsvg .live.bad{stroke:var(--rust)}
.wsvg .hpath{stroke:var(--ai);stroke-width:6;opacity:.55}
.wsvg .hdot{fill:var(--ai)}
@media (prefers-reduced-motion:no-preference){.wsvg .hdot{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.wmsg{min-height:2.8em;margin:6px 0 0;font-size:14px;color:var(--muted);text-align:center;max-width:36ch;margin-inline:auto}
.card #wbox{display:grid;justify-items:center;grid-template-columns:minmax(0,1fr)}
.card #wbox .pad{margin:12px auto 0}
#mchint{justify-content:center;margin-top:-4px;margin-bottom:8px}
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">言葉散歩 <small>Котоба Сампо<span class="who-line"> · <span id="who-st"></span> <span id="sync-st"></span></span></small></div>
    <nav aria-label="Разделы">
      <button data-go="home">Сегодня</button><button data-go="lessons">Уроки</button><button data-go="kana">Справочник</button><button data-go="progress">Прогресс</button><button data-go="options">Настройки</button>
    </nav>
  </header>
  <main>
    <div id="home" data-view="home"></div>
    <div id="session" data-view="session" hidden></div>
    <div id="lessons" data-view="lessons" hidden></div>
    <div id="lesson" data-view="lesson" hidden></div>
    <div id="kana" data-view="kana" hidden></div>
    <div id="phrases" data-view="phrases" hidden></div>
    <div id="songs" data-view="songs" hidden></div>
    <div id="progress" data-view="progress" hidden></div>
    <div id="options" data-view="options" hidden></div>

{id:"day1",title:"Гласные и строка か",kana:"あいうえおかきくけこ",min:20,
 intro:`<p>В японском три письменности. <b>Хирагана</b> — основная азбука: окончания, частицы, простые слова. <b>Катакана</b> — для иностранных слов, её возьмём на второй неделе. <b>Кандзи</b> — иероглифы, они появятся позже внутри слов.</p>
<p>Каждый знак хираганы — это слог: гласная (あ) или согласная + гласная (か = k + a). Всего 46 базовых знаков, и их удобно учить строками по пять. Таблица всегда идёт в порядке гласных <b>а, и, у, э, о</b>.</p>
<p><b>Как звучат гласные.</b> Они короче и спокойнее русских. <b>う</b> произносится без вытянутых вперёд губ, почти как русское «ы» с округлением. <b>え</b> ближе к «э», чем к «е». Если слышишь разницу с русским звуком, ориентируйся на звук, а не на кириллицу: кириллица в скобках только примерная подсказка.</p>
<p><b>Как будет устроен урок.</b> Сначала знакомимся с каждым знаком: смотрим порядок черт, слушаем, обводим пальцем или мышкой. После каждых пяти знаков лёгкая проверка с выбором ответа. В конце пишешь чтения сам, и знаки попадают в повторения на завтра.</p>`,
 extra:["Возьми тетрадь в клетку и напиши каждый знак 5 раз по порядку черт.","У Нечаевой прочитай вводную часть: что такое хирагана, катакана и кандзи."]},
{id:"day2",title:"Строки さ и た",kana:"さしすせそたちつてと",min:20,
 intro:`<p>Сегодня две строки, и в каждой есть знак, который читается «не по правилу». По логике таблицы было бы si, ti, tu, но японцы говорят иначе:</p>
<ul><li><b>し</b> — shi: мягкое «щи», что-то между «си» и «щи».</li><li><b>ち</b> — chi: мягкое «чи».</li><li><b>つ</b> — tsu: «цу».</li></ul>
<p>Остальные знаки читаются ровно: sa, su, se, so, ta, te, to. Японская <b>す</b> часто звучит почти как «с» с едва слышным «у»: です произносят как «дэс».</p>`,
 extra:["Напиши по памяти строки あ, か, さ, た. Ошибки обведи.","Обрати внимание, как в речи глотается у в す и つ."]},
{id:"day3",title:"Строки な и は",kana:"なにぬねのはひふへほ",min:20,
 intro:`<p>Строка な читается как русские на, ни, ну, нэ, но. В строке は два нюанса:</p>
<ul><li><b>ふ</b> — fu, но это не русское «ф». Звук мягкий, губы почти не смыкаются, как будто дуешь на свечу: что-то между «ф» и «х».</li><li><b>ひ</b> — hi, ближе к мягкому «хи», почти «щи» на выдохе.</li></ul>
<p>Заранее про грамматику: когда は работает частицей «что касается…», она читается <b>wa</b>, а へ в роли частицы «в сторону» читается <b>e</b>. В словах они читаются обычно. Встретишь это уже в こんにちは на седьмой день.</p>`,
 extra:["Напиши по памяти строки あ–は.","В Sekiro попробуй услышать любое знакомое слово, например しのび."]},
{id:"day4",title:"Строки ま и や",kana:"まみむめもやゆよ",min:15,
 intro:`<p>Строка ま простая: ма, ми, му, мэ, мо. В строке や только три знака: <b>や ゆ よ</b> (я, ю, ё). Знаки yi и ye в современном языке не используются, поэтому в таблице на их местах пусто.</p>
<p>Сегодня появятся знаки, которые легко спутать с уже знакомыми. В конце урока сравним пары <b>ぬ / め</b> (у ぬ есть петелька внизу), <b>は / ほ</b> (у ほ сверху лишняя черта), <b>さ / き</b> (у き две горизонтальные черты).</p>`,
 extra:["Напиши по памяти строки あ–や.","Выпиши рядом пары ぬ/め, は/ほ, さ/き и найди отличие."],
 pairs:[["ぬ","め"],["は","ほ"],["さ","き"]]},
{id:"day5",title:"Строки ら, わ и ん",kana:"らりるれろわをん",min:15,
 intro:`<p>Японский <b>r</b> — это не русское «р» и не «л», а один короткий удар языком по нёбу, что-то посередине. Не раскатывай его.</p>
<ul><li><b>を</b> — пишется wo, но читается «о». Используется только как частица, указывающая на объект действия.</li><li><b>ん</b> — единственный знак, который не слог, а отдельный звук «н». Перед б, п, м он звучит как «м»: さんぽ → «сампо».</li></ul>
<p>После урока у тебя будет вся базовая таблица, 46 знаков.</p>`,
 extra:["Напиши по памяти всю таблицу.","Сравни пары る/ろ (у る петелька) и れ/ね/わ (разный хвостик)."],
 pairs:[["る","ろ"],["れ","ね"],["ね","わ"]]},
{id:"day6",title:"Звонкие ゛ и ゜",kana:"がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ",min:25,
 intro:`<p>Новые формы учить не нужно: к знакомым знакам добавляются значки.</p>
<ul><li>Две чёрточки <b>゛</b> (дакутэн) делают звук звонким: k→g (か→が), s→z (さ→ざ), t→d (た→だ), h→b (は→ば).</li><li>Кружок <b>゜</b> (хандакутэн) превращает h в p: は→ぱ.</li></ul>
<p>Исключения повторяют знакомые: <b>じ</b> и <b>ぢ</b> читаются ji (дзи), <b>ず</b> и <b>づ</b> — zu (дзу). ぢ и づ встречаются редко.</p>
<p>Знаков сегодня 25, но они лёгкие: узнаёшь основу и смотришь на значок.</p>`,
 extra:["Напиши всю таблицу и звонкие по памяти."]},
{id:"day7",title:"Первые слова",words:true,min:20,
 intro:`<p>Теперь ты знаешь всю хирагану, и из неё уже складываются настоящие слова. Несколько правил чтения:</p>
<ul><li><b>Долгие гласные.</b> おう и おお читаются как одно долгое «о:»: ありがとう — «аригато:». Долгота меняет смысл, её стоит слышать.</li><li><b>は как wa.</b> В こんにちは последний знак — частица, поэтому «конничива».</li><li><b>Удвоенная н.</b> こんにちは: ん + に, звучит «н-н».</li></ul>
<p>В Sekiro многие из этих слов написаны кандзи (忍び, 狼, 葦名). Запоминать кандзи пока не надо, но приятно узнавать их на экране и на слух.</p>`,
 extra:["Напиши всю хирагану по памяти за 5 минут и посчитай, сколько знаков из 46 получилось.","Поиграй в Sekiro с японской озвучкой и лови знакомые слова."]}
];

    si:"し",ti:"ち",tu:"つ",hu:"ふ",zi:"じ",di:"ぢ",du:"づ","n'":"ん",
    "-":"ー"});
  const yo = {k:"き",s:"し",t:"ち",n:"に",h:"ひ",m:"み",r:"り",g:"ぎ",z:"じ",b:"び",p:"ぴ",d:"ぢ"};
  for (const c in yo) [["ya","ゃ"],["yu","ゅ"],["yo","ょ"]].forEach(([s,k])=>m[c+s]=yo[c]+k);
  [["sha","しゃ"],["shu","しゅ"],["sho","しょ"],["cha","ちゃ"],["chu","ちゅ"],["cho","ちょ"],
   ["ja","じゃ"],["ju","じゅ"],["jo","じょ"]].forEach(([a,b])=>m[a]=b);
  return m;
})();
function toKana(input, final=true){
  const s = input.toLowerCase().replace(/\s+/g,"");
  let out="", i=0;
  while (i<s.length){
    const c=s[i], nx=s[i+1];
    if (/[ぁ-んー]/.test(c)){ out+=c; i++; continue; }
    if (c===nx && c!=="n" && /[bcdfghjkmprstwz]/.test(c)){ out+="っ"; i++; continue; }
    if (c==="n" && nx==="n"){ out+="ん"; i+= /[aiueoy]/.test(s[i+2]||"") ? 1 : 2; continue; }
    let hit=false;
    for (const L of [3,2,1]){
      const chunk=s.substr(i,L);
      if (R2K[chunk] && !(chunk==="n")){ out+=R2K[chunk]; i+=L; hit=true; break; }
    }
    if (hit) continue;
    if (c==="n"){
      if (nx===undefined){ out+= final ? "ん" : "n"; i++; continue; }
      if (!/[aiueoy]/.test(nx)){ out+="ん"; i++; continue; }
    }
    out+=c; i++;
  }
  return out;
}

/* ---------- FSRS-4.5, параметры по умолчанию ---------- */
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY=-0.5, FACTOR=19/81, DAY=86400000;
const clampD = d=>Math.min(10,Math.max(1,d));
const retr = (t,S)=>Math.pow(1+FACTOR*t/S,DECAY);
const ivlFor = (S,r)=>Math.min(36500,Math.max(1,Math.round(S/FACTOR*(Math.pow(r,1/DECAY)-1))));
function fsrsNext(c, g, now){
  // c: {state, s, d, last}; g: 1..4
  if (!c || c.state==="new"){
    return {s:W[g-1], d:clampD(W[4]-(g-3)*W[5])};
  }
  const t=Math.max(0,(now-c.last)/DAY), R=retr(t,c.s), D=c.d, S=c.s;
  const d0e=W[4]-(4-3)*W[5];
  const nd=clampD(W[7]*d0e+(1-W[7])*(D-W[6]*(g-3)));
  let ns;
  if (g===1) ns=Math.min(S, W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-R)));
  else ns=S*(Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-R))-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1);
  return {s:Math.max(0.1,ns), d:nd};
}

/* ---------- письмо с проверкой черт ---------- */
function resample(pts,n){
  const d=[0]; for(let i=1;i<pts.length;i++) d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=d[d.length-1], out=[];
  if(L===0) return Array(n).fill(pts[0]);
  let j=0;
  for(let i=0;i<n;i++){ const t=L*i/(n-1); while(j<d.length-2&&d[j+1]<t) j++;
    const seg=d[j+1]-d[j]||1, a=(t-d[j])/seg; out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*a, pts[j][1]+(pts[j+1][1]-pts[j][1])*a]); }
  return out;
}
const plen=pts=>pts.reduce((s,p,i)=>i?s+Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]):0,0);
const meanDist=(a,b)=>a.reduce((s,p,i)=>s+Math.hypot(p[0]-b[i][0],p[1]-b[i][1]),0)/a.length;
const N_PTS=24;
function gradeFromWriting(r){ return (r.shown>0||r.mistakes>=3)?1:(r.mistakes>0||r.hints>0)?2:3; }

function makeWriter(box,k,opts={}){
  const paths=STROKES[k]||[], N=paths.length, guide=!!opts.guide;
  box.innerHTML=`<div class="pad"><svg class="wsvg" viewBox="0 0 109 109" aria-label="Поле для письма: ${esc(k)}">
    <g class="refp">${paths.map(d=>`<path d="${d}"/>`).join("")}</g>
    ${guide?`<g class="guide">${paths.map(d=>`<path d="${d}"/>`).join("")}</g>`:""}
    <g class="hintg"></g><g class="donep"></g><polyline class="live" points=""/></svg></div>
    <p class="wmsg" aria-live="polite"></p>
    <div class="row center"><button class="link" type="button" data-w="hint">Подсказка</button><button class="link" type="button" data-w="reset">Начать заново</button></div>`;
  const svg=box.querySelector("svg"), live=svg.querySelector(".live"), done=svg.querySelector(".donep"), hg=svg.querySelector(".hintg"), msg=box.querySelector(".wmsg");
  const ref=[...svg.querySelectorAll(".refp path")].map(p=>{ const L=p.getTotalLength(); const pts=[]; for(let i=0;i<N_PTS;i++){ const q=p.getPointAtLength(L*i/(N_PTS-1)); pts.push([q.x,q.y]); } return {pts,L}; });
  let idx, misses, hintLvl, res, pts=null, finished, gen=0, reported=false;
  const say=t=>msg.textContent=t;
  function reset(){ gen++; box.querySelector('[data-w="hint"]').hidden=false; box.querySelector('[data-w="reset"]').textContent='Начать заново'; idx=0; misses=0; hintLvl=0; res={mistakes:0,hints:0,shown:0}; finished=false; done.innerHTML=""; hg.innerHTML=""; live.setAttribute("points","");
    say(guide?`Обведи по контуру. Черта 1 из ${N}.`:`Напиши по памяти. Черт: ${N}.`); }
  function addDone(i,cls){ const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",paths[i]); p.setAttribute("class",cls); done.appendChild(p); }
  function advance(){ idx++; misses=0; hintLvl=0; hg.innerHTML="";
    if(idx>=N){ finished=true; const r=res; box.querySelector('[data-w="hint"]').hidden=true; box.querySelector('[data-w="reset"]').textContent='Написать ещё раз';
      say(r.mistakes===0&&r.hints===0&&r.shown===0?`Отлично: все ${N} ${plural(N,"черта","черты","черт")} верно.`:`Готово. Ошибок: ${r.mistakes}, подсказок: ${r.hints}.`);
      if(!reported&&opts.onDone){ reported=true; opts.onDone(r); } }
    else if(!guide) say(`Черта ${idx+1} из ${N}.`); else say(`Черта ${idx+1} из ${N}.`); }
  function compare(u){
    const U=resample(u,N_PTS), tol=(guide?15:21)*(ref[idx].L<22?1.25:1);
    const R=ref[idx].pts, d=meanDist(U,R), dr=meanDist(U,R.slice().reverse());
    if(d<tol) return {ok:true};
    if(dr<tol) return {why:"reverse"};
    for(let j=idx+1;j<N;j++) if(meanDist(U,ref[j].pts)<tol) return {why:"order",j};
    return {why:"shape"};
  }
  function showHint(){
    if(finished) return; res.hints++; hintLvl++;
    const s=ref[idx].pts[0];
    if(hintLvl===1){ hg.innerHTML=`<circle class="hdot" cx="${s[0]}" cy="${s[1]}" r="5"/>`; say(`Черта ${idx+1} начинается в мигающей точке.`); }
    else { hg.innerHTML=`<circle class="hdot" cx="${s[0]}" cy="${s[1]}" r="5"/><path class="hpath" d="${paths[idx]}"/>`;
      const hp=hg.querySelector(".hpath"), L=hp.getTotalLength(); hp.style.strokeDasharray=L; hp.style.strokeDashoffset=L;
      requestAnimationFrame(()=>{ hp.style.transition="stroke-dashoffset 900ms ease-in-out"; hp.style.strokeDashoffset=0; });
      say(`Черта ${idx+1} идёт вот так. Повтори её.`); }
  }
  function fail(why,j){
    res.mistakes++; misses++;
    live.classList.add("bad"); setTimeout(()=>{ live.classList.remove("bad"); live.setAttribute("points",""); },550);
    if(misses>=3){ misses=-99; addDone(idx,"shown"); res.shown++; say(`Показал черту ${idx+1}, идём дальше.`); const g=gen; setTimeout(()=>{ if(g===gen) advance(); },600); return; }
    if(why==="reverse"){ say(`Эту черту пишут в другую сторону.`); hintLvl=0; showHint(); res.hints--; }
    else if(why==="order") say(`Это черта ${j+1}, а сейчас нужна ${idx+1}. Черты пишутся сверху вниз и слева направо.`);
    else say(`Не похоже на черту ${idx+1}. Попробуй ещё раз${misses===2?" или возьми подсказку":""}.`);
  }
  const pos=e=>{ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*109,(e.clientY-r.top)/r.height*109]; };
  svg.addEventListener("pointerdown",e=>{ if(finished) return; e.preventDefault(); pts=[pos(e)]; svg.setPointerCapture(e.pointerId); live.setAttribute("points",pts.map(p=>p.join(",")).join(" ")); });
  svg.addEventListener("pointermove",e=>{ if(!pts) return; pts.push(pos(e)); live.setAttribute("points",pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")); });
  const up=()=>{ if(!pts) return; const u=pts; pts=null;
    if(plen(u)<3 && ref[idx].L>12){ live.setAttribute("points",""); return; }
    if(u.length<2) u.push([u[0][0]+.1,u[0][1]+.1]);
    const r=compare(u);
    if(r.ok){ live.setAttribute("points",""); addDone(idx,"ok"); advance(); } else fail(r.why,r.j); };
  svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  box.querySelector('[data-w="hint"]').onclick=showHint;
  box.querySelector('[data-w="reset"]').onclick=reset;
  reset();
  return {result:()=>res, finished:()=>finished};
}

const SUPA={"url": "https://PROJECT.supabase.co", "key": "sb_publishable_Ya5xOWu9oz0gvh-fIT5ohw_8PEe2P_j"};

  async function rpc(fn,body){

  // слияние двух копий прогресса: по каждой карточке берём более свежую
  function merge(a,b){
    if(!a||!a.cards) return b; if(!b||!b.cards) return a;
    const out=JSON.parse(JSON.stringify(b));
    for(const id in a.cards){ const x=a.cards[id], y=out.cards[id]; if(!y||(x.last||0)>(y.last||0)) out.cards[id]=x; }
    const seen=new Set(out.log.map(l=>l.t+"|"+l.id)); for(const l of a.log||[]) if(!seen.has(l.t+"|"+l.id)) out.log.push(l);
    out.log.sort((p,q)=>p.t-q.t);
    out.lessons=Object.assign({},a.lessons||{},out.lessons||{});
    const fr=new Set((out.custom||[]).map(c=>c.front)); out.custom=(out.custom||[]).concat((a.custom||[]).filter(c=>!fr.has(c.front)));
    if((a._settingsAt||0)>(out._settingsAt||0)){ out.settings=a.settings; out._settingsAt=a._settingsAt; }
    if((a._lyricsAt||0)>(out._lyricsAt||0)){ out.lyrics=a.lyrics; out._lyricsAt=a._lyricsAt; }

  }

    // сразу показываем локальную копию, потом подтягиваем сервер

/* ---------- данные ---------- */
const KANA={}, ALLWORDS=[];
DATA.forEach(n=>{ if(n.kind==="kana") KANA[n.front]=n; else ALLWORDS.push(n); });
// профиль: в веб-версии задаётся при входе; без Sekiro для Маши
let PROFILE={name:"igor",title:"Игорь",sekiro:true};
let WORDS0=ALLWORDS.slice();
function applyProfile(p){ PROFILE=p; WORDS0=ALLWORDS.filter(w=>p.sekiro||!w.sekiro); }
const sek=()=>PROFILE.sekiro;
const noSek=s=>sek()?s:s.filter(x=>!/Sekiro/.test(x));
const LESSON_OF={}; LESSONS.forEach(l=>{ if(l.kana) [...l.kana].forEach(k=>LESSON_OF[k]=l.id); });
const SMALL={"ゃ":"ya","ゅ":"yu","ょ":"yo","っ":"(пауза)","ー":"(долгота)"};

/* ---------- хранилище ---------- */
let KEY="kotoba-sanpo-v2";
const DEFAULTS={newPerDay:10,maxReviews:80,retention:0.9,sessionMin:20,audio:true,writing:true};
let S;
function fresh(){ return {cards:{},log:[],custom:[],lessons:{},settings:{}}; }
function normalize(){ S.cards=S.cards||{}; S.log=S.log||[]; S.custom=S.custom||[]; S.lessons=S.lessons||{}; S.settings=Object.assign({},DEFAULTS,S.settings||{}); }
function load(){ try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; } if(!S) S=fresh(); normalize(); }
let saveOk=true;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); saveOk=true; }catch(e){ saveOk=false; } if(typeof SYNC!=="undefined") SYNC.push(); }
function st(id){ return S.cards[id]||{state:"new"}; }
function dayStart(t){ const d=new Date(t-4*3600000); d.setHours(0,0,0,0); return d.getTime()+4*3600000; }
const words=()=>WORDS0.concat(S.custom.map(c=>Object.assign({group:"mine",custom:true},c)));
const wordBy=f=>words().find(w=>w.front===f);

/* ---------- карточки и план ---------- */
function noteFor(id){ const [t,f]=[id.slice(0,id.indexOf(":")),id.slice(id.indexOf(":")+1)]; return {type:t, n: t[0]==="k"?KANA[f]:wordBy(f)}; }
function candidates(){
  // новые карточки, которые уже можно показывать (после урока и первого успешного повторения)
  const out=[];
  for(const w of words()){
    const r=st("wr:"+w.front);
    if(r.state==="new" && w.custom) out.push("wr:"+w.front);
    if(r.state==="review" && r.s>=3 && st("wp:"+w.front).state==="new") out.push("wp:"+w.front);
  }
  return out;
}
function newToday(){ const ds=dayStart(Date.now()); return new Set(S.log.filter(l=>l.t>=ds&&l.first&&!l.lesson).map(l=>l.id)).size; }
function plan(now=Date.now()){
  const due=Object.keys(S.cards).filter(id=>{const x=S.cards[id]; return x.state==="review"&&x.due<=now && noteFor(id).n && (S.settings.writing||!id.startsWith("kw:"));});
  const R=id=>retr((now-S.cards[id].last)/DAY,S.cards[id].s);
  due.sort((a,b)=>R(a)-R(b));
  const slots = due.length>S.settings.maxReviews ? 0 : Math.max(0,S.settings.newPerDay-newToday());
  return {due, dueShown:due.slice(0,S.settings.maxReviews), news:candidates().slice(0,slots)};
}
function lastStudy(){ return S.log.length? S.log[S.log.length-1].t : 0; }
function nextLesson(){ return LESSONS.find(l=>!S.lessons[l.id]); }
function introduce(id,g){
  const now=Date.now(); if(S.cards[id]) return;
  S.cards[id]={state:"review",s:W[g-1],d:clampD(W[4]-(g-3)*W[5]),last:now,due:dayStart(now)+DAY,reps:1,lapses:0};
  S.log.push({t:now,id,g,first:1,lesson:1});
}
function gradeCard(id,g){
  const now=Date.now(), x=st(id), first=x.state==="new";
  const nx=fsrsNext(first?null:x,g,now);
  let iv= g===1 ? 1 : ivlFor(nx.s,S.settings.retention);
  if(first) iv=Math.min(iv,1);
  S.cards[id]={state:"review",s:nx.s,d:nx.d,last:now,due:dayStart(now)+iv*DAY,reps:(x.reps||0)+1,lapses:(x.lapses||0)+(g===1&&!first?1:0)};
  S.log.push({t:now,id,g,first:first?1:undefined});
  if(S.log.length>20000) S.log=S.log.slice(-20000);
  save();
}

/* ---------- порядок черт (KanjiVG) ---------- */
function strokeSVG(k,cls="strokes"){
  const p=STROKES[k]; if(!p) return `<div class="kana big" lang="ja">${esc(k)}</div>`;
  return `<svg class="${cls}" viewBox="0 0 109 109" aria-label="Порядок черт ${esc(k)}" role="img">
   <g class="guide">${p.map(d=>`<path d="${d}"/>`).join("")}</g>
   <g class="anim">${p.map(d=>`<path d="${d}"/>`).join("")}</g></svg>`;
}
const reduce=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
function animate(svg){
  if(!svg) return; const ps=[...svg.querySelectorAll(".anim path")];
  svg._run=(svg._run||0)+1; const run=svg._run;
  ps.forEach(p=>{ const L=p.getTotalLength(); p.style.transition="none"; p.style.strokeDasharray=L; p.style.strokeDashoffset=reduce()?0:L; });
  if(reduce()) return;
  let t=250;
  ps.forEach(p=>{ const L=p.getTotalLength(), dur=Math.max(350,L*9);
    setTimeout(()=>{ if(svg._run!==run) return; p.style.transition=`stroke-dashoffset ${dur}ms ease-in-out`; p.style.strokeDashoffset=0; },t);
    t+=dur+180; });
}

      ${lessonToday?`<p class="muted">Сегодня урок уже был. По плану следующий завтра: сон помогает запомнить. Но решать тебе.</p>`:""}
      <button class="${rev&&!lessonToday?"ghost":"primary"}" id="go-lesson">${lessonToday?"Всё равно начать":"Начать урок"}</button>

      rev?`<h1>Повторение: ${rev} ${plural(rev,"карточка","карточки","карточек")}</h1><p class="sub">Только то, что ты уже прошёл. Примерно ${mins} мин.</p><button class="primary" id="go-review">Повторить</button>`
      :`<h1>Повторять сегодня нечего</h1><p class="sub">${forecastLine()}</p>`}
    ${back}
    ${lessonBlock}
    <section class="panel fun"><p class="eyebrow">Для удовольствия</p>${sek()?`<h2>Фразы из Sekiro и песни</h2><p lang="ja" class="fun-jp">眠れ、永遠に</p><p class="muted">«Спи вечно» и ещё две фразы с озвучкой и разбором по словам. А ещё раздел песен: вставь текст любимой песни, и приложение разберёт его по словам со звуком.</p><div class="row"><button class="ghost" id="go-ph">Фразы из Sekiro</button><button class="ghost" id="go-sg">Песни</button></div>`:`<h2>Песни</h2><p class="muted">Вставь текст любимой японской песни, и приложение подпишет чтения, разберёт строки по словам и озвучит их по слогам. Можно открыть уже сейчас.</p><div class="row"><button class="ghost" id="go-sg">Песни</button></div>`}</section>

function offline(){

/* ---------- уроки ---------- */
function introFor(l){ return sek()? l.intro : l.intro.replace(/<p>[^<]*Sekiro[\s\S]*?<\/p>/g,""); }
function renderLessons(){

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function chunks(a,n){ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
function startLesson(id){
  const l=LESSONS.find(x=>x.id===id); const steps=[{t:"intro"}];
  if(l.kana){
    for(const ch of chunks([...l.kana],5)){ ch.forEach(k=>steps.push({t:"meet",k})); steps.push({t:"quiz",items:ch}); if(S.settings.writing) steps.push({t:"write",items:ch}); }
    if(l.pairs) steps.push({t:"pairs"});

    const ws=WORDS0;

function optionsFor(item){
  if(item.w){ const pool=shuffle(words().filter(x=>x.front!==item.w.front)).slice(0,3).map(x=>x.ru); return shuffle(pool.concat(item.w.ru)); }

  const learned=Object.keys(KANA).filter(k=>S.lessons[LESSON_OF[k]]||met.has(k));
  const pool=item.only? item.only.filter(k=>k!==item.k) : shuffle(learned.filter(k=>k!==item.k && KANA[k].romaji!==KANA[item.k].romaji)).slice(0,3);
  const ks=shuffle(pool.concat(item.k));
  return item.dir==="r"? ks.map(k=>KANA[k].romaji) : ks;
}

/* ---------- повторение ---------- */
function startSession(){
  const p=plan(); const r=p.dueShown.slice(), n=p.news.slice(), q=[];
  while(r.length||n.length){ for(let k=0;k<3&&r.length;k++) q.push({id:r.shift()}); if(n.length) q.push({id:n.shift()}); }
  sess={q,i:0,start:Date.now(),done:0,right:0,asked:false};
  go("session"); next();
}
function next(){
  if(!sess) return;
  if(sess.i>=sess.q.length) return endSession();
  if(!sess.asked && Date.now()-sess.start>S.settings.sessionMin*60000){
    sess.asked=true;
    $("#session").innerHTML=`<div class="pause"><h1>Прошло ${S.settings.sessionMin} минут</h1><p class="sub">Хорошее место, чтобы остановиться. Оставшиеся ${sess.q.length-sess.i} спокойно перейдут на завтра.</p>

}
function renderReview(){

    <p class="keys">Enter: проверить или принять · 1–4: оценка</p>`;

function showAnswer(ok,typed,preview=false){

  else sol=`<div class="sol"><span class="kana mid" lang="ja">${esc(n.front)}</span> <span class="muted">${esc(n.romaji)}</span></div>`;
  const verdict= type==="kw"? "" : ok===true?`<p class="ok">Верно${sess.hinted?" (с подсказкой)":""}</p>`: ok===false?`<p class="miss">${typed?`Твой ответ: ${esc(toKana(typed))}. `:""}Ничего страшного: после ошибки правильный ответ держится крепче.</p>`:"";
  $("#answer").innerHTML=`${verdict}${sol}${n.note && (ok!==true||type!=="k")?`<p class="mnem">${esc(n.note)}</p>`:""}${canSpeak()?`<button class="link" id="say">▶ Произношение</button>`:""}`;
  $("#say")?.addEventListener("click",()=>speak(n.front));
  if(type==="kw") animate($("#answer svg"));
  if(S.settings.audio) speak(n.front);

  let sugg= ok===false?1:3; if(ok&&sess.hinted) sugg=2; if(type==="kw"&&sess.wres) sugg=gradeFromWriting(sess.wres);
  const x=st(item.id), now=Date.now();
  $("#controls").innerHTML=["Снова","Трудно","Хорошо","Легко"].map((l,k)=>{ const g=k+1;
    const iv = item.practice? (g===1?"ещё раз":"дальше") : g===1? "ещё раз сегодня" : x.state==="new"? "завтра" : fmtIvl(ivlFor(fsrsNext(x,g,now).s,S.settings.retention));
    return `<button class="grade g${g}${g===sugg?" sugg":""}" data-g="${g}"><span>${l}</span><small>${iv}</small></button>`; }).join("");

function grade(g){

}
function endSession(){
  const s=sess; sess=null; if(!s) return go("home");
  const mins=Math.max(1,Math.round((Date.now()-s.start)/60000));
  $("#session").innerHTML=`<div class="pause"><p class="eyebrow">Готово</p><h1>На сегодня с повторением всё</h1>
    <dl class="sum"><div><dt>Карточек</dt><dd>${s.done}</dd></div><div><dt>Вспомнено сразу</dt><dd>${s.done?Math.round(s.right/s.done*100):0}%</dd></div><div><dt>Минут</dt><dd>${mins}</dd></div></dl>
    <p class="sub">${forecastLine()}${!saveOk?" <b>Браузер не дал сохранить прогресс. Сделай копию в настройках.</b>":""}</p>
    <div class="row"><button class="primary" id="home-btn">На главную</button></div></div>`;
  $("#home-btn").onclick=()=>go("home");
}
document.addEventListener("keydown",e=>{
  if(!sess||!sess.cur||document.querySelector('[data-view="session"]').hidden) return;
  if(e.target.tagName==="INPUT" && !e.target.disabled){ if(e.key==="Enter"){ e.preventDefault(); $("#check")?.click(); } return; }
  if(!sess.revealed){ if(noteFor(sess.cur.id).type==="kw") return; if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("#reveal")?.click(); } return; }
  if(["1","2","3","4"].includes(e.key)) grade(+e.key);
  else if(e.key==="Enter"){ e.preventDefault(); grade(sess.sugg||3); }
});

/* ---------- справочник ---------- */
const GRID=[["あいうえお","か き く け こ".replace(/ /g,""),"さしすせそ","たちつてと","なにぬねの","はひふへほ","まみむめも","や ゆ よ","らりるれろ","わ   を","ん    "],
            ["がぎぐげご","ざじずぜぞ","だぢづでど","ばびぶべぼ","ぱぴぷぺぽ"]];
function renderKana(){
  const cell=k=>{ if(k===" ") return `<span class="cell empty"></span>`; const x=st("k:"+k); const c=x.state==="new"?"n":x.s>=21?"m":"l";
    return `<button class="cell ${c}" data-k="${k}"><span lang="ja">${k}</span><small>${esc(KANA[k].romaji)}</small></button>`; };
  const grid=rows=>rows.map(r=>`<div class="grow">${[...r.padEnd(5," ")].map(cell).join("")}</div>`).join("");
  $("#kana").innerHTML=`<h1>Справочник</h1><p class="sub">Нажми на знак, чтобы увидеть порядок черт, мнемонику и услышать звук. Цвет: <span class="cell-l n">не пройден</span> <span class="cell-l l">учится</span> <span class="cell-l m">закреплён</span></p>
   <div class="row">${sek()?`<button class="ghost" id="k-ph">Фразы из Sekiro</button>`:""}<button class="ghost" id="k-sg">Песни</button></div>
   <div id="detail"></div>
   <section class="panel"><h2>Хирагана</h2><div class="kgrid">${grid(GRID[0])}</div></section>
   <section class="panel"><h2>Звонкие</h2><div class="kgrid">${grid(GRID[1])}</div></section>
   <section class="panel"><h2>Слова</h2><div class="wlist">${words().map(w=>`<div><span lang="ja">${esc(w.front)}</span><span>${esc(w.ru)}</span><small>${esc(w.romaji)}</small></div>`).join("")}</div></section>
   <section class="panel"><h2>Добавить своё слово</h2><p class="muted">Например, из урока Нечаевой${sek()?" или увиденное в Sekiro":""}. Оно придёт в повторениях с ответом при первом показе.</p>
    <form id="addf" class="form">
      <label>Слово (латиницей или каной)<input id="f-jp" required placeholder="tsuki"><span id="f-pv" class="preview" lang="ja"></span></label>
      <label>Перевод<input id="f-ru" required placeholder="луна"></label>
      <label>Заметка, необязательно<input id="f-note" placeholder="${sek()?"Sekiro: 月":"Нечаева, урок 2"}"></label>
      <div class="row"><button class="primary" type="submit">Добавить</button><span id="f-msg" class="muted"></span></div>
    </form></section>
   <p class="muted credit">Порядок черт: <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>, Ulrich Apel, CC BY-SA 3.0.</p>`;
  document.querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k, n=KANA[k];
    $("#detail").innerHTML=`<section class="panel detail"><div class="meet-glyph">${strokeSVG(k)}</div><div><p class="reading"><b>${esc(n.romaji)}</b> <span class="muted">${esc(n.ru)}</span></p><p class="mnem">${esc(n.note)}</p>
      <div class="row"><button class="link" id="d-re">↻ Порядок черт</button>${canSpeak()?`<button class="link" id="d-say">▶ Звук</button>`:""}<button class="link" id="d-x">Закрыть</button></div></div></section>`;
    const svg=$("#detail svg"); animate(svg); $("#d-re").onclick=()=>animate(svg); $("#d-say")?.addEventListener("click",()=>speak(k)); $("#d-x").onclick=()=>$("#detail").innerHTML="";
    speak(k); $("#detail").scrollIntoView({behavior:"smooth",block:"nearest"}); });
  $("#k-ph")?.addEventListener("click",()=>go("phrases")); $("#k-sg").onclick=()=>go("songs");
  const jp=$("#f-jp"); jp.oninput=()=>$("#f-pv").textContent=toKana(jp.value,false);
  $("#addf").onsubmit=e=>{ e.preventDefault(); const front=toKana(jp.value.trim()); if(!front) return;
    if(words().some(w=>w.front===front)){ $("#f-msg").textContent="Такое слово уже есть."; return; }
    S.custom.push({kind:"word",front,romaji:/[a-z]/i.test(jp.value)?jp.value.trim().toLowerCase():front,ru:$("#f-ru").value.trim(),note:$("#f-note").value.trim()});
    save(); renderKana(); $("#f-msg").textContent="Добавлено: "+front; };
}

/* ---------- прогресс ---------- */
function renderProgress(){
  const now=Date.now(), ids=Object.keys(S.cards), rv=ids.map(i=>S.cards[i]);
  const kIds=ids.filter(i=>i.startsWith("k:")), mastered=kIds.filter(i=>S.cards[i].s>=21).length;
  const month=S.log.filter(l=>l.t>now-30*DAY&&!l.first); const ret=month.length?Math.round(month.filter(l=>l.g>1).length/month.length*100):null;
  const ds=dayStart(now), fc=[]; for(let k=0;k<7;k++){ const a=ds+k*DAY,b=a+DAY; fc.push(rv.filter(x=>k===0?x.due<b:x.due>=a&&x.due<b).length); }
  const mx=Math.max(5,...fc), days=["сегодня","завтра"].concat([2,3,4,5,6].map(k=>new Date(ds+k*DAY).toLocaleDateString("ru-RU",{weekday:"short"})));
  const wr=ids.filter(i=>i.startsWith("wr:")).length;
  $("#progress").innerHTML=`<h1>Прогресс</h1><p class="sub">Только то, что ты знаешь. Счётчика дней подряд нет специально: пропуск дня ничего не ломает.</p>
   <dl class="sum big"><div><dt>Уроков пройдено</dt><dd>${Object.keys(S.lessons).length}<small>/${LESSONS.length}</small></dd></div>
    <div><dt>Знаков изучено</dt><dd>${kIds.length}<small>/71</small></dd></div><div><dt>Закреплено (от 3 недель)</dt><dd>${mastered}</dd></div>
    <div><dt>Слов</dt><dd>${wr}</dd></div><div><dt>Вспоминаешь (30 дней)</dt><dd>${ret===null?"—":ret+"%"}</dd></div></dl>
   ${ret!==null?`<p class="muted">Цель около ${Math.round(S.settings.retention*100)}%. Ниже 80% стоит притормозить с новыми уроками.</p>`:""}
   <section class="panel"><h2>Повторения на неделю вперёд</h2><div class="bars" role="img" aria-label="Прогноз повторений на 7 дней">${fc.map((v,k)=>`<div class="bar"><span class="v">${v}</span><i style="height:${v/mx*100}%"></i><span class="d">${days[k]}</span></div>`).join("")}</div></section>`;
}

/* ---------- настройки ---------- */
function renderOptions(){
  const s=S.settings;
  const who=typeof SYNC!=="undefined"&&SYNC.who();
  $("#options").innerHTML=`<h1>Настройки</h1>${who?`<section class="panel"><h2>Профиль: ${esc(who.title)}</h2><p class="muted">Прогресс сохраняется на сервере и одинаковый на всех устройствах. Сейчас: <span id="sync-st2">${esc(SYNC.status()||"—")}</span>.</p><button class="ghost" id="o-out" type="button">Сменить профиль</button></section>`:""}
  <section class="panel form">
    <label>Новых упражнений в повторениях за день (письмо знаков, слова по-японски) <input type="number" id="o-new" min="0" max="50" value="${s.newPerDay}"></label>
    <label>Максимум повторений за день <input type="number" id="o-max" min="10" max="500" value="${s.maxReviews}"></label>
    <label>Мягкая остановка через, минут <input type="number" id="o-min" min="5" max="120" value="${s.sessionMin}"></label>
    <label>Желаемое запоминание <select id="o-ret">${[0.85,0.88,0.9,0.92,0.95].map(v=>`<option value="${v}" ${v==s.retention?"selected":""}>${Math.round(v*100)}%${v===0.9?" (рекомендуется)":""}</option>`).join("")}</select></label>
    <label class="check"><input type="checkbox" id="o-audio" ${s.audio?"checked":""}> Произносить автоматически</label>
    <label class="check"><input type="checkbox" id="o-write" ${s.writing?"checked":""}> Тренировать письмо знаков по памяти</label>
    <p class="muted">${canSpeak()?(jaVoice?"Японский голос: "+esc(jaVoice.name):"Японский голос в системе не найден, озвучка может звучать странно. На Windows и Mac его можно добавить в языковых настройках."):"Этот браузер не умеет озвучивать текст."} <button class="link" id="o-test" type="button">Проверить: こんにちは</button></p>
    <div class="row"><button class="primary" id="o-save" type="button">Сохранить</button><span id="o-msg" class="muted"></span></div>
  </section>
  <section class="panel"><h2>Резервная копия</h2><p>Прогресс хранится только в этом браузере. Раз в неделю копируй его в заметку или файл.</p>
    <div class="row"><button class="ghost" id="o-exp" type="button">Показать копию</button><button class="ghost" id="o-imp" type="button">Восстановить из копии</button></div>
    <textarea id="o-txt" rows="6" hidden></textarea>
    <div class="row" id="o-improw" hidden><button class="primary" id="o-apply" type="button">Заменить прогресс этой копией</button></div>
    <p id="o-bmsg" class="muted"></p></section>`;
  $("#o-out")?.addEventListener("click",()=>SYNC.logout());
  $("#o-test").onclick=()=>speak("こんにちは");
  $("#o-save").onclick=()=>{ s.newPerDay=+$("#o-new").value||0; s.maxReviews=+$("#o-max").value||80; s.sessionMin=+$("#o-min").value||20; s.retention=+$("#o-ret").value; s.audio=$("#o-audio").checked; s.writing=$("#o-write").checked; S._settingsAt=Date.now(); save(); $("#o-msg").textContent="Сохранено"; };
  const txt=$("#o-txt");
  $("#o-exp").onclick=()=>{ txt.hidden=false; txt.value=JSON.stringify(S); txt.select(); try{ navigator.clipboard.writeText(txt.value).then(()=>$("#o-bmsg").textContent="Скопировано в буфер обмена.",()=>{}); }catch(e){} };
  $("#o-imp").onclick=()=>{ txt.hidden=false; txt.value=""; txt.placeholder="Вставь сюда текст копии"; $("#o-improw").hidden=false; };
  $("#o-apply").onclick=()=>{ try{ const d=JSON.parse(txt.value); if(!d.cards||!d.log) throw 0; S=d; normalize(); save(); $("#o-bmsg").textContent="Прогресс восстановлен."; }catch(e){ $("#o-bmsg").textContent="Это не похоже на копию из приложения: проверь, что текст вставлен целиком."; } };
}

/* ---------- старт ---------- */
function startApp(skipLoad){
  if(!skipLoad) load();
  try{ navigator.storage?.persist?.(); }catch(e){}
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const h0=(location.hash||"").slice(1); go(VIEWS.includes(h0)&&!(h0==="phrases"&&!sek())?h0:"home");
}
if(typeof SYNC!=="undefined") SYNC.boot(); else startApp();
